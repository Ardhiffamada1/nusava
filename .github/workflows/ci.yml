name: CommerceOS CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: commerceos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client & Push Schema
        run: |
          pnpm --filter @commerceos/contracts build
          pnpm --filter @commerceos/database push
          pnpm --filter @commerceos/database build
          pnpm --filter @commerceos/ui build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/commerceos?schema=public"

      - name: Seed Demo Data
        run: pnpm --filter @commerceos/database seed
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/commerceos?schema=public"

      - name: Build All Monorepo Applications
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/commerceos?schema=public"
          JWT_SECRET: "ci-test-secret-key-must-be-min-32-chars-long"
          JWT_REFRESH_SECRET: "ci-test-refresh-key-must-be-min-32-chars-long"
